name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build site
        run: |
          mkdir -p /tmp/_site/datenschutz /tmp/_site/impressum
          cp index.html favicon.svg robots.txt sitemap.xml .nojekyll /tmp/_site/
          cp -r assets /tmp/_site/
          cp datenschutz/index.html /tmp/_site/datenschutz/
          cp impressum/index.html /tmp/_site/impressum/

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rf . --quiet 2>/dev/null || true
          cp -r /tmp/_site/. .
          git add .
          git diff --staged --quiet || git commit -m "Deploy to GitHub Pages"
          git push origin gh-pages --force
